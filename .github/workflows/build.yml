name: Build Winlator G-cor

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

env:
  JAVA_VERSION: '17'
  ANDROID_PLATFORM: 'android-35'
  ANDROID_BUILD_TOOLS: '35.0.0'
  ANDROID_NDK_VERSION: '25.2.9519653'

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout repository with submodules
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Apply app submodule overhaul patch
        run: git -C app apply -p1 ../patches/app-overhaul.patch

      - name: Materialize x86_64 fallback sources
        run: |
          mkdir -p app/app/src/main/cpp/midihandler app/app/src/main/cpp/libadrenotools/src
          cp patches/app-src/midihandler_stub.c app/app/src/main/cpp/midihandler/midihandler_stub.c
          cp patches/app-src/x86_64_stub.c app/app/src/main/cpp/libadrenotools/src/x86_64_stub.c

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}

      - name: Install pinned Android command-line tools
        run: |
          set -euo pipefail
          SDK_ROOT="${RUNNER_TEMP}/android-sdk"
          TOOLS_VERSION="11076708"
          TOOLS_ZIP="${RUNNER_TEMP}/commandlinetools-linux-${TOOLS_VERSION}_latest.zip"
          rm -rf "${SDK_ROOT}" "${RUNNER_TEMP}/cmdline-tools"
          mkdir -p "${SDK_ROOT}/cmdline-tools" "${RUNNER_TEMP}/cmdline-tools"
          curl --fail --location --retry 5 --retry-all-errors \
            "https://dl.google.com/android/repository/commandlinetools-linux-${TOOLS_VERSION}_latest.zip" \
            --output "${TOOLS_ZIP}"
          unzip -q "${TOOLS_ZIP}" -d "${RUNNER_TEMP}/cmdline-tools"
          mv "${RUNNER_TEMP}/cmdline-tools/cmdline-tools" "${SDK_ROOT}/cmdline-tools/12.0"
          {
            echo "ANDROID_HOME=${SDK_ROOT}"
            echo "ANDROID_SDK_ROOT=${SDK_ROOT}"
            echo "ANDROID_CMDLINE_TOOLS_VERSION=12.0"
          } >> "${GITHUB_ENV}"
          echo "${SDK_ROOT}/cmdline-tools/12.0/bin" >> "${GITHUB_PATH}"

      - name: Install Android build dependencies
        run: |
          set -euo pipefail
          sdkmanager --sdk_root="${ANDROID_SDK_ROOT}" "platform-tools" "platforms;${ANDROID_PLATFORM}" "build-tools;${ANDROID_BUILD_TOOLS}" "cmake;3.22.1" "ndk;${ANDROID_NDK_VERSION}"
          yes | sdkmanager --sdk_root="${ANDROID_SDK_ROOT}" --licenses >/dev/null

      - name: Make build scripts executable
        run: chmod +x app/gradlew scripts/*.sh

      - name: Resolve and verify latest ARM64 runtimes
        run: scripts/fetch-runtime-assets.sh

      - name: Build runtime rootfs overlay
        run: scripts/build-runtime-rootfs.sh

      - name: Build native C++ backend and Java frontend
        working-directory: app
        run: ./gradlew :app:assembleRelease --no-daemon --stacktrace

      - name: Verify APK output
        run: |
          test -s app/app/build/outputs/apk/release/app-release.apk
          sha256sum app/app/build/outputs/apk/release/app-release.apk > app-release.apk.sha256

      - name: Upload APK and runtime artifacts
        uses: actions/upload-artifact@v4
        with:
          name: winlator-g-cor-release
          path: |
            app/app/build/outputs/apk/release/app-release.apk
            app-release.apk.sha256
            runtime-rootfs.tar.xz
            runtime-cache/runtime.env

      - name: Create GitHub Release on main push
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: Winlator G-cor build ${{ github.run_number }}
          generate_release_notes: true
          files: |
            app/app/build/outputs/apk/release/app-release.apk
            app-release.apk.sha256
            runtime-rootfs.tar.xz
            runtime-cache/runtime.env
